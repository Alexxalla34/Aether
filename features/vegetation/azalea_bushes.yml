id: AZALEA_BUSHES
type: FEATURE

distributor:
  type: AND
  distributors:
    - type: SAMPLER
      sampler:
        type: POSITIVE_WHITE_NOISE
        salt: 14400
      threshold: 0.08
    - type: SAMPLER
      sampler:
        type: PROBABILITY
        sampler:
          type: OPEN_SIMPLEX_2
          frequency: 0.03
          salt: 14401
      threshold: 0.5

locator:
  type: AND
  locators:
    - type: SURFACE
      range: &range
        min: 1
        max: $meta.yml:top-y
    - type: PATTERN
      range: *range
      pattern:
        type: MATCH_SET
        blocks: $features/vegetation/meta.yml:plantable-blocks
        offset: -1

structures:
  distribution:
    type: WHITE_NOISE
    salt: 14402
  structures:
    - BLOCK:minecraft:flowering_azalea: 2
    - BLOCK:minecraft:azalea: 1
