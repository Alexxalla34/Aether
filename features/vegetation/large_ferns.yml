id: LARGE_FERNS
type: FEATURE

distributor:
  type: SAMPLER
  sampler:
    type: POSITIVE_WHITE_NOISE
    salt: 3341
  threshold: 0.05

locator:
  type: AND
  locators:
    - type: TOP
      range: &range
        min: 1
        max: $meta.yml:top-y
    - type: PATTERN
      range: *range
      pattern:
        type: MATCH_SET
        blocks: $features/vegetation/meta.yml:plantable-blocks
        offset: -1
    - type: PATTERN # Needs 2 blocks of air for a large fern!
      range: *range
      pattern:
        type: MATCH_SET
        blocks:
          - minecraft:air
        offset: 0
    - type: PATTERN
      range: *range
      pattern:
        type: MATCH_SET
        blocks:
          - minecraft:air
        offset: 1

structures:
  distribution:
    type: CONSTANT
  structures:
    - BLOCK:minecraft:large_fern: 1
