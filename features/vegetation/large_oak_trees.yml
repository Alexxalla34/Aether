id: LARGE_OAK_TREES
type: FEATURE

distributor:
  type: SAMPLER
  sampler:
    type: POSITIVE_WHITE_NOISE
    salt: 15300
  threshold: 0.05 # Dense for the forest

locator:
  type: AND
  locators:
    - type: TOP
      range: &range
        min: 1
        max: $meta.yml:top-y
    - type: PATTERN
      range: *range
      pattern:
        type: MATCH_SET
        blocks: $features/vegetation/meta.yml:dry-plantable-blocks
        offset: -1
    - type: PATTERN
      range: *range
      pattern:
        type: MATCH_SET
        blocks:
          - minecraft:air
        offset: 0

structures:
  distribution:
    type: CONSTANT
  structures:
    - large_oak_tree_procedural: 2
    - large_oak_tree_procedural_2: 1
