id: EQ_FLAT_ISLAND
type: BIOME
abstract: true

# Flat, wide floating islands (used by Golden Grasslands)
# Higher flatness = more compressed vertically = flatter plateaus

terrain:
  sampler:
    type: EXPRESSION
    expression: |
      -1.2 + threshold +
      -if(y > 65 + layerPhase(x, 0, z) * 90, y - (65 + layerPhase(x, 0, z) * 90), ((65 + layerPhase(x, 0, z) * 90) - y) * bottomRatio) / layerSpacing * layerStrength +
      lerp(y, maxH, 0, maxH - taper,
        max(
          lerp(y, minH - ucTranslate, 0, minH - ucTranslate + taper,
            islandNoise(x, y * flatness, z) * 1.4
          ),
          lerp(y, minH, 0, minH + taper,
            islandNoise(x, (y - ucTranslate) * flatness, z) * ucMask(x, y / 2, z) * 1.7
          )
        )
      ) - if(caveNoise(x, y, z) > caveThreshold, caveStrength, 0)
    variables:
      threshold: $customization.yml:island-threshold
      layerSpacing: 30      # Moderately flat
      layerStrength: 0.70   # Increased from 0.50 to force flat tops
      bottomRatio: 0.20     # Lowered from 0.25 to keep bottom extremely deep
      maxH: 230
      minH: 10
      taper: 40
      flatness: 0.30        # Increased from 0.15 to strip out more noise height
      ucTranslate: -24
      caveThreshold: $customization.yml:cave-threshold
      caveStrength: $customization.yml:cave-carve-strength
    samplers:

      islandNoise:
        dimensions: 3
        type: PROBABILITY
        sampler:
          type: DOMAIN_WARP
          amplitude: 40
          warp:
            type: OPEN_SIMPLEX_2
            frequency: 0.005
            salt: 9001
          sampler:
            type: FBM
            octaves: 2
            sampler:
              type: OPEN_SIMPLEX_2
              frequency: $customization.yml:island-frequency
              salt: 2001
      caveNoise:
        dimensions: 3
        type: PROBABILITY
        sampler:
          type: FBM
          octaves: 2
          sampler:
            type: OPEN_SIMPLEX_2
            frequency: $customization.yml:cave-frequency
            salt: 3001
      ucMask:
        dimensions: 3
        type: PROBABILITY
        sampler:
          type: RIDGED
          octaves: 3
          gain: 1
          sampler:
            type: OPEN_SIMPLEX_2
            frequency: 0.004
            salt: 2002
      layerPhase:
        dimensions: 3
        type: PROBABILITY
        sampler:
          type: FBM
          octaves: 2
          sampler:
            type: OPEN_SIMPLEX_2
            frequency: 0.004
            salt: 5002
