id: YELLOW_TERRAIN
type: BIOME
abstract: true
vanilla: minecraft:the_void
ocean:
  palette: BLOCK:minecraft:air

terrain:
  sampler:
    type: EXPRESSION
    expression: |
      -1+threshold+ 
        simplex(x,z)/2+
      lerp(y, max, 0, max-taper,
        max(
          lerp(y, min-undercarriageTranslate, 0, min-undercarriageTranslate+taper,
            simplex3(x, y*flatness, z)
          ),
          lerp(y, min, 0, min+taper,
            simplex3(x, (y-undercarriageTranslate)*flatness, z) * undercarriageMask(x, y/2, z) * 1.3
          )
        )
      )
    variables:
      threshold: 0.6
      max: $customization.yml:island-max-height
      min: $customization.yml:island-min-height
      taper: $customization.yml:island-taper
      flatness: $customization.yml:island-flatness
      undercarriageTranslate: $customization.yml:island-undercarriage-translate
    samplers:
      simplex:
        dimensions: 2
        type: OPEN_SIMPLEX_2
        frequency: 0.004
      simplex3:
        dimensions: 3
        type: FBM
        octaves: 5
        sampler:
          type: OPEN_SIMPLEX_2
          frequency: 0.004
      undercarriageMask:
        dimensions: 3
        type: RIDGED
        octaves: 3
        gain: 1
        sampler:
          type: OPEN_SIMPLEX_2
          frequency: 0.005
