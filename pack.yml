id: AETHER
version: 1.0.0
author: "Custom"

generator: NOISE_3D

addons:
  biome-provider-pipeline: "2.+"
  biome-provider-single: "1.+"
  chunk-generator-noise-3d: "1.+"
  config-biome: "1.+"
  config-noise-function: "1.+"
  config-ore: "1.+"
  config-palette: "1.+"
  config-distributors: "1.+"
  config-locators: "1.+"
  config-feature: "1.+"
  structure-terrascript-loader: "1.+"
  terrascript-function-sampler: "1.+" # Crucial for sampler() in scripts
  structure-function-check-noise-3d: "1.+"
  language-yaml: "1.+"
  generation-stage-feature: "1.+"
  palette-block-shortcut: "1.+"
  structure-block-shortcut: "1.+"

# Biome distribution
biomes: $biome-distribution/presets/aether.yml:biomes

# Population stages
stages:
  # Cave carving inside islands
  - id: caves
    type: FEATURE

  # Ore and deposit generation inside stone
  - id: ores
    type: FEATURE

  # Trees on island surfaces
  - id: trees
    type: FEATURE
    blend:
      amplitude: 30
      sampler:
        type: GAUSSIAN
        salt: 2583

  # Grass, flowers, small vegetation
  - id: flora
    type: FEATURE
    blend:
      amplitude: 30
      sampler:
        type: GAUSSIAN
        salt: 2934

functions:
  "<<":
    - math/functions/interpolation.yml:functions
    - math/functions/maskSmooth.yml:functions

samplers:
  "<<":
    - math/samplers/floating_islands.yml:samplers
    - math/samplers/simplex.yml:samplers