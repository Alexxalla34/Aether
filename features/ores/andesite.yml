id: andesite
type: FEATURE

distributor:
  type: SAMPLER
  sampler:
    type: FBM
    octaves: 3
    sampler:
      type: OPEN_SIMPLEX_2
      frequency: 0.05
  threshold: 0.5

locator:
  type: PATTERN
  range:
    min: $meta.yml:bottom-y
    max: $meta.yml:top-y
  pattern:
    type: MATCH
    offset: 0
    block: minecraft:stone

structures:
  distribution:
    type: CONSTANT
  structures:
    - andesite_structure: 1
